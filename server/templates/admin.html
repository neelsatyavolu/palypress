<!doctype html>
<html lang="en">
  <head>
    <title>Beta Admin — APP_NAME_PLACEHOLDER</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        --ink: #11181c;
        --ink-soft: #5b6770;
        --paper: #f5f4f1;
        --line: #e3dfd6;
        --green: #1b5e3f;
        --green-deep: #0f3d28;
        --amber: #8a6d1a;
        --red: #9b1c1c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 28px 20px 64px;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 26px;
        margin: 0 0 2px;
      }
      .muted {
        color: var(--ink-soft);
        font-size: 14px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 22px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 12px 36px rgba(17, 24, 28, 0.06);
      }

      /* Login */
      .login {
        max-width: 380px;
        margin: 8vh auto 0;
        padding: 30px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      input {
        width: 100%;
        font-size: 15px;
        font-family: inherit;
        padding: 12px 13px;
        border: 1px solid var(--line);
        border-radius: 11px;
        outline: none;
      }
      input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(27, 94, 63, 0.14);
      }
      button {
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        padding: 11px 16px;
        color: #fff;
        background: var(--green);
        transition: background 0.15s, opacity 0.15s;
      }
      button:hover {
        background: var(--green-deep);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button.ghost {
        background: transparent;
        color: var(--ink-soft);
        border: 1px solid var(--line);
      }
      button.ghost:hover {
        background: #f3f1ec;
      }
      button.sm {
        padding: 7px 12px;
        font-size: 13px;
      }
      button.reject {
        background: #fff;
        color: var(--red);
        border: 1px solid #eccccc;
      }
      button.reject:hover {
        background: #fdecec;
      }
      .err {
        color: var(--red);
        font-size: 13px;
        margin-top: 12px;
        min-height: 16px;
      }

      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 13px 16px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        background: #faf9f6;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .pill {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
      }
      .pill.pending {
        background: #fbf3da;
        color: var(--amber);
      }
      .pill.approved {
        background: #eaf3ee;
        color: var(--green-deep);
      }
      .pill.rejected {
        background: #fdecec;
        color: var(--red);
      }
      .pill.open {
        background: #fbf3da;
        color: var(--amber);
      }
      .pill.removed {
        background: #eaf3ee;
        color: var(--green-deep);
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .right {
        text-align: right;
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: var(--ink-soft);
      }
      .row-msg {
        font-size: 12px;
        color: var(--ink-soft);
      }
      .hidden {
        display: none;
      }
      .stats {
        display: flex;
        gap: 18px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .stat {
        font-size: 13px;
        color: var(--ink-soft);
      }
      .stat b {
        color: var(--ink);
        font-size: 18px;
        font-family: Georgia, serif;
      }
      .panel-heading {
        margin: 28px 0 10px;
      }
      .panel-heading h2 {
        font-family: Georgia, serif;
        font-size: 20px;
        margin: 0 0 2px;
      }
      .feedback-message {
        max-width: 420px;
        white-space: pre-wrap;
      }
      .user-line {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Login view -->
    <div id="login-view" class="card login">
      <h1>Beta Admin</h1>
      <p class="muted" style="margin-top: 0">Enter the admin password to continue.</p>
      <form id="login-form" style="margin-top: 18px">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
        <div class="err" id="login-err"></div>
        <button type="submit" id="login-btn" style="width: 100%; margin-top: 8px">
          Sign in
        </button>
      </form>
    </div>

    <!-- Dashboard view -->
    <div id="dash-view" class="wrap hidden">
      <div class="topbar">
        <div>
          <h1>Beta signups</h1>
          <p class="muted" id="subtitle">Loading…</p>
        </div>
        <button class="ghost" id="logout-btn">Sign out</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="panel-heading">
        <h2>Beta signups</h2>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th class="right">Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty hidden" id="empty">No signups yet.</div>
      </div>

      <div class="panel-heading">
        <h2>App feedback</h2>
        <p class="muted" id="feedback-subtitle">Loading…</p>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Feedback</th>
              <th>User</th>
              <th class="right">Submitted</th>
            </tr>
          </thead>
          <tbody id="feedback-rows"></tbody>
        </table>
        <div class="empty hidden" id="feedback-empty">No feedback yet.</div>
      </div>

      <div class="panel-heading">
        <h2>Comment reports</h2>
        <p class="muted" id="reports-subtitle">Loading…</p>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Comment</th>
              <th>Author / reporter</th>
              <th>Status</th>
              <th class="right">Actions</th>
            </tr>
          </thead>
          <tbody id="report-rows"></tbody>
        </table>
        <div class="empty hidden" id="reports-empty">No reports yet.</div>
      </div>
    </div>

    <script>
      var loginView = document.getElementById("login-view");
      var dashView = document.getElementById("dash-view");
      var loginForm = document.getElementById("login-form");
      var loginBtn = document.getElementById("login-btn");
      var loginErr = document.getElementById("login-err");

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }

      function api(path, opts) {
        opts = opts || {};
        opts.credentials = "same-origin";
        return fetch(path, opts).then(function (r) {
          return r.json().then(function (data) {
            return { ok: r.ok, status: r.status, data: data };
          });
        });
      }

      function show(view) {
        loginView.classList.toggle("hidden", view !== "login");
        dashView.classList.toggle("hidden", view !== "dash");
      }

      var ROLE_LABELS = {
        student: "Student",
        staff: "Staff",
        parent: "Parent",
        alumni: "Alumni",
      };

      function fmtDate(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        return d.toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      }

      function fmtDateTime(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        return d.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });
      }

      function render(signups) {
        var rows = document.getElementById("rows");
        var empty = document.getElementById("empty");
        var stats = document.getElementById("stats");
        rows.innerHTML = "";

        document.getElementById("subtitle").textContent =
          signups.length + " total";

        var counts = { pending: 0, approved: 0, rejected: 0 };
        signups.forEach(function (s) {
          counts[s.status] = (counts[s.status] || 0) + 1;
        });
        stats.innerHTML =
          '<div class="stat"><b>' +
          counts.pending +
          "</b> pending</div>" +
          '<div class="stat"><b>' +
          counts.approved +
          "</b> approved</div>" +
          '<div class="stat"><b>' +
          counts.rejected +
          "</b> rejected</div>";

        empty.classList.toggle("hidden", signups.length > 0);

        signups.forEach(function (s) {
          var tr = document.createElement("tr");
          var actions =
            s.status === "pending"
              ? '<div class="actions">' +
                '<button class="sm approve" data-id="' +
                s.id +
                '">Approve</button>' +
                '<button class="sm reject" data-id="' +
                s.id +
                '">Reject</button></div>'
              : '<div class="actions"><span class="row-msg">' +
                (s.reviewedAt ? fmtDate(s.reviewedAt) : "") +
                "</span></div>";

          tr.innerHTML =
            "<td><b>" +
            esc(s.name) +
            '</b><div class="row-msg">' +
            fmtDate(s.createdAt) +
            "</div></td>" +
            '<td><a href="mailto:' +
            esc(s.email) +
            '">' +
            esc(s.email) +
            "</a></td>" +
            "<td>" +
            esc(ROLE_LABELS[s.role] || s.role) +
            "</td>" +
            '<td><span class="pill ' +
            esc(s.status) +
            '">' +
            esc(s.status) +
            "</span></td>" +
            '<td class="right">' +
            actions +
            "</td>";
          rows.appendChild(tr);
        });
      }

      function renderFeedback(feedback) {
        var rows = document.getElementById("feedback-rows");
        var empty = document.getElementById("feedback-empty");
        rows.innerHTML = "";

        document.getElementById("feedback-subtitle").textContent =
          feedback.length + " total";
        empty.classList.toggle("hidden", feedback.length > 0);

        feedback.forEach(function (f) {
          var tr = document.createElement("tr");
          var userName = f.userDisplayName || "Unnamed user";
          var userEmail = f.userEmail || "";
          tr.innerHTML =
            '<td class="feedback-message">' +
            esc(f.message) +
            "</td>" +
            '<td><div class="user-line">' +
            esc(userName) +
            '</div><div class="row-msg">' +
            esc(userEmail) +
            "</div></td>" +
            '<td class="right">' +
            fmtDateTime(f.createdAt) +
            "</td>";
          rows.appendChild(tr);
        });
      }

      function loadSignups() {
        return api("/api/admin/beta").then(function (res) {
          if (res.status === 401) {
            show("login");
            return;
          }
          if (res.ok && res.data.signups) {
            show("dash");
            render(res.data.signups);
          }
        });
      }

      function loadFeedback() {
        return api("/api/admin/feedback").then(function (res) {
          if (res.status === 401) {
            show("login");
            return;
          }
          if (res.ok && res.data.feedback) {
            renderFeedback(res.data.feedback);
          }
        });
      }

      function renderReports(reports) {
        var rows = document.getElementById("report-rows");
        var empty = document.getElementById("reports-empty");
        rows.innerHTML = "";
        document.getElementById("reports-subtitle").textContent =
          reports.length + " total — act within 24 hours";
        empty.classList.toggle("hidden", reports.length > 0);
        reports.forEach(function (r) {
          var tr = document.createElement("tr");
          var actions =
            r.status === "open"
              ? '<div class="actions"><button class="sm remove-report" data-id="' +
                r.id +
                '">Remove &amp; suspend</button></div>'
              : '<div class="actions"><span class="row-msg">' +
                (r.resolvedAt ? fmtDateTime(r.resolvedAt) : "") +
                "</span></div>";
          tr.innerHTML =
            '<td class="feedback-message"><b>' +
            esc(r.reason) +
            "</b><div class=\"row-msg\">" +
            esc(r.commentExcerpt) +
            "</div></td>" +
            "<td><div class=\"user-line\">" +
            esc(r.commentAuthorName) +
            '</div><div class="row-msg">' +
            esc(r.reporterEmail || "anonymous") +
            " · " +
            esc(r.publicationId) +
            "</div></td>" +
            '<td><span class="pill ' +
            esc(r.status) +
            '">' +
            esc(r.status) +
            "</span></td>" +
            '<td class="right">' +
            actions +
            "</td>";
          rows.appendChild(tr);
        });
      }

      function loadReports() {
        return api("/api/admin/reports").then(function (res) {
          if (res.status === 401) {
            show("login");
            return;
          }
          if (res.ok && res.data.reports) {
            renderReports(res.data.reports);
          }
        });
      }

      function loadDashboard() {
        loadSignups();
        loadFeedback();
        loadReports();
      }

      function act(id, action, btn) {
        var buttons = btn.parentNode.querySelectorAll("button");
        buttons.forEach(function (b) {
          b.disabled = true;
        });
        btn.textContent = action === "approve" ? "Approving…" : "Rejecting…";
        api("/api/admin/beta/" + id + "/" + action, { method: "POST" }).then(
          function (res) {
            if (res.ok && res.data.success) {
              loadDashboard();
            } else {
              alert(res.data.error || "Action failed.");
              loadDashboard();
            }
          },
        );
      }

      document.getElementById("rows").addEventListener("click", function (e) {
        var t = e.target;
        if (t.classList.contains("approve")) act(t.dataset.id, "approve", t);
        if (t.classList.contains("reject")) act(t.dataset.id, "reject", t);
      });

      document.getElementById("report-rows").addEventListener("click", function (e) {
        var t = e.target;
        if (!t.classList.contains("remove-report")) return;
        t.disabled = true;
        t.textContent = "Removing…";
        api("/api/admin/reports/" + t.dataset.id + "/remove", {
          method: "POST",
        }).then(function (res) {
          if (res.ok && res.data.success) {
            loadReports();
          } else {
            alert(res.data.error || "Could not remove the comment.");
            loadReports();
          }
        });
      });

      document.getElementById("logout-btn").addEventListener("click", function () {
        api("/api/admin/logout", { method: "POST" }).then(function () {
          show("login");
        });
      });

      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        loginErr.textContent = "";
        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in…";
        api("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: document.getElementById("password").value,
          }),
        }).then(function (res) {
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign in";
          if (res.ok && res.data.success) {
            document.getElementById("password").value = "";
            loadDashboard();
          } else {
            loginErr.textContent = res.data.error || "Incorrect password.";
          }
        });
      });

      // On load: check existing session
      api("/api/admin/session").then(function (res) {
        if (res.ok && res.data.isAdmin) {
          loadDashboard();
        } else {
          show("login");
        }
      });
    </script>
  </body>
</html>
